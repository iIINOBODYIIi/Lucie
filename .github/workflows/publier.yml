name: Publier Lucie

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numero de version (ex. v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publier:
    runs-on: windows-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Installer MSBuild de Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Compiler Lucie
        shell: pwsh
        run: |
          $projet = Get-ChildItem -Recurse -Filter Lucie.csproj | Select-Object -First 1
          if (-not $projet) { Write-Error "Lucie.csproj introuvable"; exit 1 }
          Write-Host "Projet trouve : $($projet.FullName)"
          msbuild $projet.FullName /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true "/p:PublishDir=$PWD/publish/Lucie/" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ajouter les fichiers d'interface
        shell: pwsh
        run: |
          $build = Get-ChildItem -Recurse -Filter Lucie.exe | Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $build) { Write-Error "Dossier de compilation introuvable"; exit 1 }
          Write-Host "Copie depuis : $($build.DirectoryName)"
          Copy-Item "$($build.DirectoryName)\*" publish/Lucie -Recurse -Force
          $pri = Get-ChildItem publish/Lucie -Filter *.pri
          if (-not $pri) { Write-Error "Fichier .pri manquant : Lucie ne pourra pas s'afficher"; exit 1 }
          $pri | ForEach-Object { Write-Host "OK : $($_.Name)" }

      - name: Creer le zip
        shell: pwsh
        run: |
          if (Test-Path publish/Lucie/VoiceModel/vosk-model-fr) { Remove-Item -Recurse -Force publish/Lucie/VoiceModel/vosk-model-fr }
          Compress-Archive -Path publish/Lucie -DestinationPath Lucie-Windows-x64.zip -Force

      - name: Mettre en ligne
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Lucie ${{ github.event.inputs.version || github.ref_name }}
          files: Lucie-Windows-x64.zip
          generate_release_notes: true
