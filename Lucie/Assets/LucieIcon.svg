<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Gélule noire, très légèrement bombée -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26272B"/>
      <stop offset="0.35" stop-color="#0B0B0D"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <!-- Reflet doux sur le dessus -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Yeux légèrement nacrés -->
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9DCE3"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Ombre portée discrète -->
  <rect x="20" y="80" width="216" height="110" rx="55" fill="#000000" opacity="0.35" filter="url(#shadow)"/>

  <!-- Corps -->
  <rect x="14" y="70" width="228" height="116" rx="58" fill="url(#body)"/>
  <rect x="34" y="76" width="188" height="40" rx="20" fill="url(#shine)"/>
  <rect x="15" y="71" width="226" height="114" rx="57" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Halo des yeux -->
  <ellipse cx="106" cy="128" rx="12" ry="20" fill="#FFFFFF" opacity="0.55" filter="url(#glow)"/>
  <ellipse cx="150" cy="128" rx="12" ry="20" fill="#FFFFFF" opacity="0.55" filter="url(#glow)"/>

  <!-- Yeux -->
  <rect x="98" y="110" width="16" height="36" rx="8" fill="url(#eye)"/>
  <rect x="142" y="110" width="16" height="36" rx="8" fill="url(#eye)"/>
</svg>
