<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F3D"/>
      <stop offset="1" stop-color="#16181F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#9AB8FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9AB8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi, verre sombre -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#glow)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="62.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Le visage de Lucie -->
  <rect x="74" y="78" width="30" height="58" rx="15" fill="#EEF1F7"/>
  <rect x="152" y="78" width="30" height="58" rx="15" fill="#EEF1F7"/>
  <ellipse cx="68" cy="160" rx="17" ry="10" fill="#FF9EB5" opacity="0.55"/>
  <ellipse cx="188" cy="160" rx="17" ry="10" fill="#FF9EB5" opacity="0.55"/>
  <path d="M104 168 Q128 192 152 168" fill="none" stroke="#EEF1F7" stroke-width="12" stroke-linecap="round"/>

  <!-- Petite touche de couleur : l'accent de Lucie -->
  <circle cx="200" cy="56" r="14" fill="#9AB8FF"/>
</svg>
